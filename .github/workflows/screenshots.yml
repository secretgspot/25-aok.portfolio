name: Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh project screenshots'
          file_pattern: 'src/lib/screenshots.generated.json static/screenshots/**'
